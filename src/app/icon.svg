<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rim with subtle shadow -->
  <circle cx="32" cy="32" r="29" fill="url(#rimGrad)" filter="url(#shadow)" />

  <!-- Inner Coin Face -->
  <circle cx="32" cy="32" r="25" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="3,1.5" />

  <!-- Center Monogram "F" for FlipBit -->
  <path d="M26 18 H40 C41.5 18 42 19 42 20.5 C42 22 41.5 23 40 23 H31 V29 H38 C39.5 29 40 30 40 31.5 C40 33 39.5 34 38 34 H31 V45 C31 46.5 30 47 28.5 47 C27 47 26 46.5 26 45 Z" fill="#451A03" opacity="0.3" transform="translate(0.5, 0.5)"/>
  <path d="M26 18 H40 C41.5 18 42 19 42 20.5 C42 22 41.5 23 40 23 H31 V29 H38 C39.5 29 40 30 40 31.5 C40 33 39.5 34 38 34 H31 V45 C31 46.5 30 47 28.5 47 C27 47 26 46.5 26 45 Z" fill="#FFFFFF"/>

  <!-- Specular highlight -->
